; DerethFX config lives next to acclient.exe and d3d9.dll.
; Defaults match the current tested tuning if this file is missing.

[Effects]
textureDetail=1
waterReflection=0
dynamicLighting=0
metalSheen=0
surfaceDetail=0
volumetricFog=0
extendRenderDistance=1
protectAlphaLights=1
softAlphaFix=0
suppressShadowPlanes=0

[Alpha]
softAlphaRef=10

[SurfaceDetail]
strength=0.350

[TextureDetail]
minPrimitiveCount=4
anisotropy=16
mipBias=-0.850

[Water]
minPrimitiveCount=80
maxPrimitiveCount=220
strength=0.550

[DynamicLighting]
minPrimitiveCount=4
maxPrimitiveCount=16
ambientR=38
ambientG=38
ambientB=44
materialSpecular=0.38
materialSpecularBlue=0.44
materialPower=34.0
diffuseStrength=1.00
specularStrength=0.90
lightFlickerStrength=0.05
lightMotionStrength=0.18

[Atmosphere]
; D3D9 fixed-function fog, nudged toward softer distance haze.
fogStartScale=1.050
fogEndScale=1.250
fogDensityScale=0.150
minFogEnd=40000.0

[RenderDistance]
; Extends the projection far plane. Client-side terrain/object culling can still win.
farPlane=80000.000

[Logging]
; quiet = no log, normal = startup/effect notices, debug = frame summaries and draw diagnostics
level=normal
frameSummaries=0
drawSampling=0
waterDiagnostics=0

[Shadows]
maxPrimitiveCount=2

[Metal]
minPrimitiveCount=4
maxPrimitiveCount=48
specular=0.620
specularBlue=0.70
power=72.000

[ReShade]
; Optional chainload. Rename ReShade's DX9 d3d9.dll to this file and place it next to acclient.exe.
chainLoad=0
dll=reshade_d3d9.dll
[HUD]
; F10 cycles disabled -> crawler -> ironman. Also available in the F9 config window.
enabled=0
mode=crawler
x=18
y=92
opacity=220
[CrawlerHUD]
; Optional Crawler detail lines. A live sidecar named derethfx_hud.ini can override these without touching this file.
showDetails=1
perks=
bonuses=
progress=
pending=
